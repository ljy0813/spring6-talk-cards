
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAFAF6">
<title>Talk Cards | SPARTA NBC</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  font-family: -apple-system, BlinkMacSystemFont,
    "Pretendard", "Noto Sans KR", sans-serif;
  color: #242724;
  background: #FAFAF6;
  --ink: #273029;
  --muted: #818A80;
  --line: #E7EAE3;
  --lime: #D8F58B;
  --mint: #C9F3E3;
  --lilac: #E0CBFA;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 36px 16px 50px;
  background: #FAFAF6;
}
button { cursor: pointer; font: inherit; }
button:focus-visible,
a:focus-visible {
  outline: 3px solid #A5D66C;
  outline-offset: 3px;
}
.shell { max-width: 760px; margin: auto; }

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 27px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: Fredoka, sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: #727E70;
}
.brand::before {
  content: "";
  width: 10px;
  height: 10px;
  background: var(--lime);
  border: 1.5px solid var(--ink);
  border-radius: 50%;
}
h1 {
  font-family: Fredoka, sans-serif;
  font-weight: 600;
  font-size: clamp(39px, 7vw, 49px);
  letter-spacing: -1px;
  margin: 9px 0 3px;
}
.subtitle {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
  margin: 0;
}

/* 작고 단순한 타이머 */
.timer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 12px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 17px;
  white-space: nowrap;
  box-shadow: 0 4px 16px #20302007;
}
.clock {
  font-family: Fredoka, sans-serif;
  font-size: 24px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  min-width: 68px;
  color: var(--ink);
}
.timer button {
  display: grid;
  place-items: center;
  border: 1px solid #E4E8DF;
  border-radius: 10px;
  width: 30px;
  height: 32px;
  background: #F7F8F5;
  color: #394339;
  font-size: 17px;
  font-weight: 700;
  transition: transform .15s;
}
.timer button:hover { transform: translateY(-1px); }
.timer button:active { transform: scale(.94); }
.timer button:disabled { opacity: .35; cursor: default; }
.timer #toggle {
  background: var(--lime);
  border-color: #C6E77E;
  width: 36px;
}
.timer #reset {
  border: 0;
  background: transparent;
  font-size: 20px;
}

/* 전체 컨텐츠 */
.panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 5px 24px #27352709;
}
.label {
  font-size: 12px;
  font-weight: 750;
  color: #707A70;
  margin-bottom: 13px;
}
.categories {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}
.cat {
  border: 1.5px solid #E7EBE3;
  background: #F6F8F4;
  border-radius: 14px;
  min-height: 47px;
  color: #687468;
  font-size: 12px;
  font-weight: 750;
  padding: 10px 5px;
  transition: .2s;
}
.cat:hover { transform: translateY(-2px); }
.cat.active {
  background: #27342A;
  color: white;
  border-color: #27342A;
}

/* 겹쳐진 장난감 카드 */
.deck {
  position: relative;
  isolation: isolate;
  margin: 30px 9px 38px;
  padding-bottom: 12px;
  touch-action: pan-y;
}
.deck::before,
.deck::after {
  content: "";
  position: absolute;
  inset: 7px 5px 0;
  border: 2px solid #303A32;
  border-radius: 25px;
  pointer-events: none;
}
.deck::before {
  background: var(--lilac);
  transform: rotate(-3deg) translate(-5px, 4px);
  z-index: -2;
}
.deck::after {
  background: var(--mint);
  transform: rotate(2.5deg) translate(5px, 3px);
  z-index: -1;
}
.card {
  position: relative;
  z-index: 1;
  min-height: 320px;
  display: flex;
  flex-direction: column;
  padding: 25px;
  background: #F3FCE8;
  border: 2px solid #303A32;
  border-radius: 25px;
  box-shadow: 4px 6px 0 #303A3215;
  transform-origin: center bottom;
  will-change: transform, opacity;
}
.cardtop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  color: #747E70;
}
.counter {
  background: white;
  padding: 6px 11px;
  border-radius: 30px;
  border: 1px solid #DCE7D4;
  font-family: Fredoka, sans-serif;
  white-space: nowrap;
}
.question {
  display: flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px 5px;
  font-size: clamp(21px, 4vw, 27px);
  font-weight: 750;
  line-height: 1.55;
  letter-spacing: -.6px;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.hint {
  text-align: center;
  font-size: 11px;
  color: #8A9586;
}

/* 카드 전환 애니메이션 */
.card.out-left {
  animation: outLeft .22s ease-in forwards;
}
.card.out-right {
  animation: outRight .22s ease-in forwards;
}
.card.in-right {
  animation: inRight .38s cubic-bezier(.2,1.2,.35,1) both;
}
.card.in-left {
  animation: inLeft .38s cubic-bezier(.2,1.2,.35,1) both;
}
@keyframes outLeft {
  to {
    transform: translateX(-100px) rotate(-9deg);
    opacity: 0;
  }
}
@keyframes outRight {
  to {
    transform: translateX(100px) rotate(9deg);
    opacity: 0;
  }
}
@keyframes inRight {
  from {
    transform: translateX(70px) rotate(7deg) scale(.96);
    opacity: 0;
  }
  to { transform: none; opacity: 1; }
}
@keyframes inLeft {
  from {
    transform: translateX(-70px) rotate(-7deg) scale(.96);
    opacity: 0;
  }
  to { transform: none; opacity: 1; }
}

/* 버튼 */
.actions {
  display: grid;
  grid-template-columns: 1fr 1.5fr 1fr;
  gap: 9px;
}
.action {
  min-height: 48px;
  border: 1px solid #E2E7DD;
  border-radius: 14px;
  background: #F6F8F4;
  color: #465247;
  font-size: 13px;
  font-weight: 750;
  transition: transform .15s;
}
.action:hover { transform: translateY(-2px); }
.action:active { transform: scale(.98); }
.action.primary {
  background: #27342A;
  color: white;
  border-color: #27342A;
}

/* 구글 시트 상태 */
.sync {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  font-size: 11px;
  color: #858E84;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #E7B16B;
  flex-shrink: 0;
}
.dot.ok { background: #5DAF88; }
#refresh {
  margin-left: auto;
  background: none;
  border: 0;
  color: #55715A;
  font-size: 11px;
  font-weight: 700;
}
.footer {
  margin-top: 19px;
  padding: 0 5px;
  font-size: 11px;
  color: #8B938A;
  line-height: 1.8;
}
.footer a { color: #506951; font-weight: 750; }
.toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: #27342A;
  color: white;
  border-radius: 13px;
  padding: 12px 18px;
  font-size: 13px;
  z-index: 10;
  box-shadow: 0 10px 30px #0002;
}

/* 모바일에서는 타이머를 제목 아래로 */
@media(max-width: 600px) {
  .top {
    flex-direction: column;
    align-items: stretch;
    gap: 18px;
  }
  .timer { align-self: flex-start; }
}
@media(max-width: 450px) {
  body { padding: 25px 12px 40px; }
  .panel { padding: 16px; border-radius: 20px; }
  .cat { font-size: 11px; }
  .deck { margin: 28px 8px 38px; }
  .card { min-height: 295px; padding: 19px; }
  .question { font-size: 21px; }
  .action { font-size: 12px; }
}
@media(prefers-reduced-motion: reduce) {
  .card { animation-duration: .01ms !important; }
  button { transition: none !important; }
}
</style>
</head>

<body>
<main class="shell">

  <header class="top">
    <div>
      <div class="brand">SPARTA NBC</div>
      <h1>Talk Cards</h1>
      <p class="subtitle">
        한 장씩 넘기면서, 조금 더 가까워지는 시간.
      </p>
    </div>

    <div class="timer" aria-label="대화 타이머">
      <span class="clock" id="clock" role="timer">20:00</span>
      <button id="minus" aria-label="1분 줄이기">−</button>
      <button id="plus" aria-label="1분 늘리기">+</button>
      <button id="toggle" aria-label="타이머 시작">▶</button>
      <button id="reset" aria-label="타이머 초기화">↺</button>
    </div>
  </header>

  <section class="panel">
    <div class="label">대화 주제 선택</div>
    <div class="categories" id="categories"></div>

    <div class="deck" id="deck">
      <div class="card" id="card">
        <div class="cardtop">
          <span id="catname">우리, 먼저 알아가기</span>
          <span class="counter" id="count">01 / 01</span>
        </div>

        <div class="question" id="question">
          질문을 불러오는 중입니다.
        </div>

        <div class="hint">
          정답은 없어요. 편하게 이야기해 보세요.
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="action" id="prev">← 이전</button>
      <button class="action primary" id="next">다음 카드 →</button>
      <button class="action" id="random">랜덤</button>
    </div>

    <div class="sync">
      <span class="dot" id="statusdot"></span>
      <span id="status" role="status">질문 시트 연결 확인 중</span>
      <button id="refresh">↻ 새로고침</button>
    </div>
  </section>

  <footer class="footer">
    <a
      href="https://docs.google.com/spreadsheets/d/1xDcP7lelWfm1TWt5vAourx9lzQVt2mcNLpMI_y8AAIY/edit"
      target="_blank"
      rel="noopener noreferrer"
    >질문 관리 구글 시트 열기 ↗</a>
    <div>
      질문 관리 시트는 운영진 전용입니다.
      수강생 여러분께서는 내용을 수정하지 말아 주세요.
    </div>
  </footer>

</main>

<script>
const SHEET = "1xDcP7lelWfm1TWt5vAourx9lzQVt2mcNLpMI_y8AAIY";
const GID = "0";

const names = [
  "우리, 먼저 알아가기",
  "함께하는 팀 프로젝트",
  "진로와 취업, 우리의 고민"
];

const labels = [
  "자기소개 · 일상",
  "팀 프로젝트",
  "진로 · 취업"
];

const fallback = [
  ["우리, 먼저 알아가기", "이번 부트캠프에 참여하게 된 이유는 무엇인가요?"],
  ["우리, 먼저 알아가기", "쉬는 날에는 보통 무엇을 하나요?"],
  ["우리, 먼저 알아가기", "최근에 푹 빠진 취미가 있나요?"],
  ["함께하는 팀 프로젝트", "지금까지 겪었던 레전드 팀플 빌런 썰을 풀어주세요!"],
  ["함께하는 팀 프로젝트", "내가 팀원들에게 가장 자신 있게 도와줄 수 있는 것은 무엇인가요?"],
  ["진로와 취업, 우리의 고민", "개발자가 아니었다면 어떤 일을 하고 있었을 것 같나요?"],
  ["진로와 취업, 우리의 고민", "취업 준비에서 가장 막막한 부분은 무엇인가요?"]
];

const el = id => document.getElementById(id);

let rows = fallback;
let category = 0;
let index = 0;
let animating = false;

function questions() {
  return rows.filter(row => row[0] === names[category]);
}

function render() {
  el("categories").innerHTML = "";

  names.forEach((name, i) => {
    const button = document.createElement("button");
    button.className = "cat" + (category === i ? " active" : "");
    button.textContent = labels[i];
    button.setAttribute("aria-pressed", category === i);

    button.onclick = () => changeCategory(i);
    el("categories").append(button);
  });

  const list = questions();

  index = list.length
    ? ((index % list.length) + list.length) % list.length
    : 0;

  el("catname").textContent = names[category];

  el("count").textContent =
    String(list.length ? index + 1 : 0).padStart(2, "0") +
    " / " +
    String(list.length).padStart(2, "0");

  el("question").textContent = list.length
    ? list[index][1]
    : "이 카테고리에 등록된 질문이 없습니다.";
}

function transition(direction, callback) {
  if (animating) return;

  animating = true;
  const card = el("card");

  card.className = "card " +
    (direction === "left" ? "out-left" : "out-right");

  setTimeout(() => {
    callback();
    render();

    card.className = "card " +
      (direction === "left" ? "in-right" : "in-left");

    setTimeout(() => {
      card.className = "card";
      animating = false;
    }, 390);
  }, 230);
}

function changeCategory(i) {
  if (i === category || animating) return;

  transition("left", () => {
    category = i;
    index = 0;
  });
}

function move(amount) {
  const length = questions().length;
  if (!length || animating) return;

  transition(amount > 0 ? "left" : "right", () => {
    index = (index + amount + length) % length;
  });
}

el("prev").onclick = () => move(-1);
el("next").onclick = () => move(1);

el("random").onclick = () => {
  const length = questions().length;
  if (length < 2 || animating) return;

  const amount = 1 + Math.floor(Math.random() * (length - 1));
  move(amount);
};

/* 모바일 스와이프 */
let touchX = 0;

el("deck").addEventListener("touchstart", e => {
  touchX = e.changedTouches[0].screenX;
}, { passive: true });

el("deck").addEventListener("touchend", e => {
  const difference = e.changedTouches[0].screenX - touchX;

  if (Math.abs(difference) > 55) {
    move(difference < 0 ? 1 : -1);
  }
}, { passive: true });

/* 구글 스프레드시트 질문 불러오기 */
function showStatus(message, connected) {
  el("status").textContent = message;
  el("statusdot").className = "dot" + (connected ? " ok" : "");
}

let requestId = 0;

function loadQuestions() {
  const id = ++requestId;
  const handler = "talkSheet" + id;
  const script = document.createElement("script");

  let finished = false;

  function cleanup() {
    script.remove();
    delete window[handler];
  }

  const timeout = setTimeout(() => {
    if (finished) return;
    finished = true;
    cleanup();
    showStatus("질문 시트 연결을 확인해 주세요", false);
  }, 9000);

  window[handler] = response => {
    if (finished) return;

    finished = true;
    clearTimeout(timeout);

    const data = (response.table?.rows || [])
      .map(row => [
        String(row.c?.[0]?.v ?? "").trim(),
        String(row.c?.[1]?.v ?? "").trim()
      ])
      .filter(row => names.includes(row[0]) && row[1]);

    if (data.length) {
      const oldQuestion = questions()[index]?.[1];

      rows = data;

      const current = questions();
      const found = current.findIndex(row => row[1] === oldQuestion);

      index = found >= 0
        ? found
        : Math.min(index, Math.max(0, current.length - 1));

      render();
      showStatus("질문 " + data.length + "개 연결됨", true);
    } else {
      showStatus("질문을 불러오지 못했습니다", false);
    }

    cleanup();
  };

  script.onerror = () => {
    if (finished) return;

    finished = true;
    clearTimeout(timeout);
    cleanup();
    showStatus("시트 연결을 확인해 주세요", false);
  };

  const query = encodeURIComponent("select A,B");
  const handlerParam = encodeURIComponent(
    "out:json;responseHandler:" + handler
  );

  script.src =
    "https://docs.google.com/spreadsheets/d/" + SHEET +
    "/gviz/tq?gid=" + GID +
    "&headers=1&tq=" + query +
    "&tqx=" + handlerParam +
    "&_=" + Date.now();

  document.head.append(script);
}

el("refresh").onclick = loadQuestions;
setInterval(loadQuestions, 60000);

/* 한 줄 타이머: 1분 단위 */
let minutes = 20;
let remaining = minutes * 60;
let running = false;
let endTime = null;

function updateClock() {
  const seconds = Math.ceil(remaining);

  el("clock").textContent =
    String(Math.floor(seconds / 60)).padStart(2, "0") +
    ":" +
    String(seconds % 60).padStart(2, "0");

  el("minus").disabled = minutes <= 1;
  el("plus").disabled = minutes >= 999;

  el("toggle").textContent = running ? "Ⅱ" : "▶";
  el("toggle").title = running ? "일시정지" : "시작";
  el("toggle").setAttribute(
    "aria-label", running ? "타이머 일시정지" : "타이머 시작"
  );
}

function adjustTime(amount) {
  minutes = Math.max(1, Math.min(999, minutes + amount));
  remaining = minutes * 60;
  running = false;
  endTime = null;
  updateClock();
}

el("minus").onclick = () => adjustTime(-1);
el("plus").onclick = () => adjustTime(1);

el("toggle").onclick = () => {
  if (running) {
    remaining = Math.max(0, (endTime - Date.now()) / 1000);
    running = false;
    endTime = null;
  } else {
    if (remaining <= 0) remaining = minutes * 60;
    endTime = Date.now() + remaining * 1000;
    running = true;
  }

  updateClock();
};

el("reset").onclick = () => {
  running = false;
  endTime = null;
  remaining = minutes * 60;
  updateClock();
};

function showToast(message) {
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = message;
  document.body.append(toast);
  setTimeout(() => toast.remove(), 4000);
}

setInterval(() => {
  if (!running) return;

  remaining = Math.max(0, (endTime - Date.now()) / 1000);

  if (remaining <= 0) {
    running = false;
    endTime = null;
    showToast("대화 시간이 끝났어요!");
  }

  updateClock();
}, 200);

render();
updateClock();
loadQuestions();
</script>
</body>
</html>
