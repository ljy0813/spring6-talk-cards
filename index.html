
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAFAF5">
  <title>Talk Cards | SPARTA NBC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #263128;
      --muted: #849081;
      --bg: #fafaf5;
      --lime: #d8f58b;
      --border: #303a32;
      font-family: "Gaegu", cursive;
      color: var(--ink);
      background: var(--bg);
      letter-spacing: -0.45px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 35px 18px 50px;
      font-family: "Gaegu", cursive;
      background: var(--bg);
    }

    button, input {
      font-family: "Gaegu", cursive;
      letter-spacing: -0.55px;
    }

    button {
      cursor: pointer;
      transition: transform .15s;
    }

    button:active { transform: scale(.96); }

    button:focus-visible, a:focus-visible {
      outline: 3px solid #a7cb70;
      outline-offset: 3px;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
    }

    /* 헤더 */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 31px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #748271;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--lime);
    }

    h1 {
      margin: 8px 0 2px;
      font-family: "Fredoka", sans-serif;
      font-size: clamp(39px, 7vw, 50px);
      font-weight: 600;
      letter-spacing: -2px;
      line-height: 1.1;
    }

    .title-dot { color: #a4c36b; }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.3;
    }

    /* 작은 한 줄 타이머 */

    .timer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e0e6db;
      border-radius: 17px;
      flex-shrink: 0;
    }

    .timer-symbol {
      font-size: 21px;
      color: #59715e;
    }

    .clock {
      min-width: 73px;
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .timer-btn {
      width: 30px;
      height: 32px;
      padding: 0;
      border: 1px solid #e0e6dc;
      border-radius: 9px;
      background: #f6f8f3;
      color: var(--ink);
      font-size: 21px;
      font-weight: 700;
    }

    .timer-btn:disabled {
      opacity: .35;
      cursor: default;
    }

    #play {
      background: var(--lime);
      font-size: 18px;
    }

    #reset {
      background: transparent;
      border-color: transparent;
      font-size: 26px;
    }

    /* 카테고리 */

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 40px;
    }

    .category-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 100px;
      background: #e9eee7;
      color: #667566;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.2;
    }

    .category-btn.active {
      background: #293a2d;
      color: white;
    }

    /* 카드 스택 */

    .deck {
      position: relative;
      isolation: isolate;
      margin: 0 12px 46px;
      touch-action: pan-y;
    }

    .back-card {
      position: absolute;
      inset: 0;
      border: 2px solid var(--border);
      border-radius: 27px;
      pointer-events: none;
      transition: background-color .25s;
    }

    .back-one {
      z-index: -2;
      transform: translate(8px, 12px) rotate(2deg);
      background: #e0cafa;
    }

    .back-two {
      z-index: -1;
      transform: translate(-8px, 8px) rotate(-2deg);
      background: #c9f0e0;
    }

    .card {
      position: relative;
      z-index: 1;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      padding: 29px;
      background: #f1fbe3;
      border: 2px solid var(--border);
      border-radius: 27px;
      transition:
        background-color .25s,
        opacity .2s,
        transform .2s;
      transform-origin: center bottom;
    }

    .card.switching-left {
      transform: translateX(-40px) rotate(-5deg);
      opacity: 0;
    }

    .card.switching-right {
      transform: translateX(40px) rotate(5deg);
      opacity: 0;
    }

    .card.entering {
      animation: cardPop .3s cubic-bezier(.2, 1.2, .35, 1);
    }

    @keyframes cardPop {
      from {
        transform: scale(.96) rotate(2deg);
        opacity: .5;
      }

      to {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-label {
      font-size: 17px;
      font-weight: 700;
      color: #5b7157;
      letter-spacing: -0.6px;
    }

    .counter {
      padding: 5px 12px;
      border: 1px solid #00000010;
      border-radius: 30px;
      background: #ffffffc9;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 질문 글씨: 볼드 + 자간 축소 */

    .question {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 35px 6px;
      text-align: center;

      font-family: "Gaegu", cursive;
      font-size: clamp(30px, 5vw, 41px);
      font-weight: 700;
      line-height: 1.28;
      letter-spacing: -1.2px;

      -webkit-text-stroke: .35px currentColor;
      paint-order: stroke fill;

      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .card-footer {
      text-align: center;
      color: #68805f;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    /* 카드 컨트롤 */

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
    }

    .circle-btn {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border: 1px solid #dce3d8;
      border-radius: 50%;
      background: white;
      color: var(--ink);
      font-size: 28px;
    }

    .next-btn {
      flex: 1;
      max-width: 350px;
      min-height: 50px;
      border: 1px solid #bada7b;
      border-radius: 100px;
      background: var(--lime);
      color: var(--ink);
      font-size: 23px;
      font-weight: 700;
    }

    /* 연결 상태 */

    .sync {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 34px;
      color: #8c9789;
      font-size: 17px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #deb76f;
    }

    .sync-dot.connected { background: #62b18c; }

    .refresh-btn {
      margin-left: auto;
      padding: 5px 0;
      border: 0;
      background: transparent;
      color: #657d63;
      font-size: 17px;
      font-weight: 700;
    }

    footer {
      margin-top: 14px;
      color: #919a8c;
      font-size: 16px;
      line-height: 1.4;
    }

    footer a {
      color: #617963;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 99;
      transform: translateX(-50%);
      padding: 12px 22px;
      border-radius: 15px;
      background: #293a2d;
      color: white;
      font-size: 21px;
      white-space: nowrap;
      box-shadow: 0 8px 25px #0002;
    }

    @media (max-width: 620px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 19px;
      }

      .categories { margin-bottom: 35px; }
    }

    @media (max-width: 450px) {
      body { padding: 25px 15px 40px; }

      h1 { font-size: 42px; }

      .subtitle { font-size: 17px; }

      .category-btn {
        padding: 9px 13px;
        font-size: 17px;
      }

      .deck { margin: 0 8px 43px; }

      .card {
        min-height: 320px;
        padding: 21px;
      }

      .question {
        font-size: 33px;
        line-height: 1.27;
      }

      .card-label { font-size: 15px; }

      .card-footer { font-size: 22px; }

      .next-btn { font-size: 21px; }

      .circle-btn {
        width: 45px;
        height: 45px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .back-card, button {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="header">
      <div class="heading">
        <div class="brand">
          <span class="brand-dot"></span>
          SPARTA NBC
        </div>

        <h1>Talk Cards<span class="title-dot">.</span></h1>

        <p class="subtitle">
          한 장씩 넘기면서, 조금 더 가까워지는 시간.
        </p>
      </div>

      <div class="timer" aria-label="대화 타이머">
        <span class="timer-symbol">◷</span>
        <span class="clock" id="clock" role="timer">20:00</span>

        <button class="timer-btn" id="minus"
                aria-label="1분 줄이기">−</button>

        <button class="timer-btn" id="plus"
                aria-label="1분 늘리기">+</button>

        <button class="timer-btn" id="play"
                aria-label="타이머 시작">▶</button>

        <button class="timer-btn" id="reset"
                aria-label="타이머 초기화">↺</button>
      </div>
    </header>

    <nav class="categories" id="categories"
         aria-label="질문 카테고리"></nav>

    <div class="deck" id="deck">
      <div class="back-card back-one" id="backOne"></div>
      <div class="back-card back-two" id="backTwo"></div>

      <section class="card" id="card">
        <div class="card-top">
          <span class="card-label" id="cardLabel">
            GET TO KNOW YOU
          </span>

          <span class="counter" id="counter">01 / 04</span>
        </div>

        <div class="question" id="question">
          질문을 불러오는 중입니다.
        </div>

        <div class="card-footer">
          ✳ Let's talk!
        </div>
      </section>
    </div>

    <div class="controls">
      <button class="circle-btn" id="prev"
              aria-label="이전 카드">←</button>

      <button class="next-btn" id="next">
        다음 카드 →
      </button>

      <button class="circle-btn" id="random"
              aria-label="랜덤 카드">⤨</button>
    </div>

    <div class="sync">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText" role="status">
        질문 시트 연결 확인 중
      </span>

      <button class="refresh-btn" id="refresh">
        ↻ 새로고침
      </button>
    </div>

    <footer>
      <a
        href="https://docs.google.com/spreadsheets/d/1xDcP7lelWfm1TWt5vAourx9lzQVt2mcNLpMI_y8AAIY/edit"
        target="_blank"
        rel="noopener noreferrer"
      >질문 관리 시트 열기 ↗</a>

      <div>
        질문 관리 시트는 운영진 전용입니다.
        수강생 여러분께서는 내용을 수정하지 말아 주세요.
      </div>
    </footer>
  </main>

  <script>
    /* 구글 시트 설정 */
    const SHEET_ID =
      "1xDcP7lelWfm1TWt5vAourx9lzQVt2mcNLpMI_y8AAIY";

    const SHEET_GID = "0";

    const categories = [
      {
        name: "우리, 먼저 알아가기",
        label: "자기소개 · 일상",
        english: "GET TO KNOW YOU"
      },
      {
        name: "함께하는 팀 프로젝트",
        label: "팀 프로젝트",
        english: "TEAM PROJECT"
      },
      {
        name: "진로와 취업, 우리의 고민",
        label: "진로 · 취업",
        english: "CAREER TALK"
      }
    ];

    /* 구글 시트에 연결되지 않을 때 사용하는 기본 질문 */
    const fallback = [
      [
        "우리, 먼저 알아가기",
        "자기소개를 해주세요! 이름, 이전에 하던 일, 부트캠프에 들어온 이유까지! (나이 제외)"
      ],
      [
        "우리, 먼저 알아가기",
        "지금 서로의 첫인상은 어떤가요?"
      ],
      [
        "우리, 먼저 알아가기",
        "살면서 겪었던 가장 웃긴 흑역사를 들려주세요!"
      ],
      [
        "우리, 먼저 알아가기",
        "나와 빠르게 친해지는 방법은 무엇인가요?"
      ],
      [
        "함께하는 팀 프로젝트",
        "지금까지 겪었던 레전드 팀플 빌런 썰을 풀어주세요!"
      ],
      [
        "함께하는 팀 프로젝트",
        "반대로, 살면서 만난 최고의 팀원은 어떤 사람이었나요?"
      ],
      [
        "함께하는 팀 프로젝트",
        "일은 잘하지만 독단적인 팀장 VS 모두의 의견을 듣지만 결정이 느린 팀장"
      ],
      [
        "진로와 취업, 우리의 고민",
        "개발자가 아니었다면 어떤 일을 하고 있었을 것 같나요?"
      ],
      [
        "진로와 취업, 우리의 고민",
        "취업 준비에서 가장 걱정되는 점은 무엇인가요?"
      ],
      [
        "진로와 취업, 우리의 고민",
        "첫 월급을 받으면 가장 먼저 무엇을 하고 싶나요?"
      ]
    ];

    const palette = [
      "#f1fbe3", // 라임
      "#ebd9fd", // 라일락
      "#fff0bb", // 옐로우
      "#d9f5ed", // 민트
      "#ffdfd6"  // 피치
    ];

    const $ = id => document.getElementById(id);

    let rows = fallback;
    let categoryIndex = 0;
    let cardIndex = 0;
    let colorIndex = 0;
    let animating = false;

    function getQuestions() {
      const name = categories[categoryIndex].name;
      return rows.filter(row => row[0] === name);
    }

    function render() {
      const group = categories[categoryIndex];
      const questions = getQuestions();

      if (questions.length > 0) {
        cardIndex =
          ((cardIndex % questions.length) + questions.length) %
          questions.length;
      } else {
        cardIndex = 0;
      }

      $("cardLabel").textContent = group.english;

      $("counter").textContent =
        String(questions.length ? cardIndex + 1 : 0)
          .padStart(2, "0") +
        " / " +
        String(questions.length).padStart(2, "0");

      $("question").textContent = questions.length
        ? questions[cardIndex][1]
        : "이 카테고리에 등록된 질문이 없습니다.";

      /* 카드를 넘길 때마다 색상 변경 */
      $("card").style.backgroundColor =
        palette[colorIndex % palette.length];

      $("backOne").style.backgroundColor =
        palette[(colorIndex + 1) % palette.length];

      $("backTwo").style.backgroundColor =
        palette[(colorIndex + 2) % palette.length];

      document.querySelectorAll(".category-btn")
        .forEach((button, i) => {
          const active = i === categoryIndex;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
    }

    /* 카테고리 버튼 생성 */
    categories.forEach((group, i) => {
      const button = document.createElement("button");
      button.className = "category-btn";
      button.textContent = group.label;

      button.addEventListener("click", () => {
        if (i === categoryIndex || animating) return;

        flipCard(() => {
          categoryIndex = i;
          cardIndex = 0;
        });
      });

      $("categories").appendChild(button);
    });

    /* 카드 전환 */
    function flipCard(update, direction = "left") {
      if (animating) return;
      animating = true;

      const card = $("card");

      card.classList.remove("entering");
      card.classList.add(
        direction === "left"
          ? "switching-left"
          : "switching-right"
      );

      setTimeout(() => {
        update();
        colorIndex += 1;
        render();

        card.classList.remove(
          "switching-left",
          "switching-right"
        );

        card.classList.add("entering");

        setTimeout(() => {
          card.classList.remove("entering");
          animating = false;
        }, 310);
      }, 200);
    }

    function move(amount) {
      const questions = getQuestions();
      const count = questions.length;

      if (!count || animating) return;

      flipCard(() => {
        cardIndex =
          (cardIndex + amount + count) % count;
      }, amount > 0 ? "left" : "right");
    }

    $("prev").addEventListener("click", () => move(-1));
    $("next").addEventListener("click", () => move(1));

    $("random").addEventListener("click", () => {
      const count = getQuestions().length;

      if (count < 2 || animating) return;

      const amount =
        1 + Math.floor(Math.random() * (count - 1));

      move(amount);
    });

    /* 모바일 카드 스와이프 */
    let touchStart = 0;

    $("deck").addEventListener("touchstart", event => {
      touchStart = event.changedTouches[0].screenX;
    }, { passive: true });

    $("deck").addEventListener("touchend", event => {
      const diff =
        event.changedTouches[0].screenX - touchStart;

      if (Math.abs(diff) > 55) {
        move(diff < 0 ? 1 : -1);
      }
    }, { passive: true });

    /* 구글 스프레드시트 연결 */
    let requestId = 0;

    function showStatus(message, connected) {
      $("syncText").textContent = message;
      $("syncDot").classList.toggle("connected", connected);
    }

    function loadQuestions() {
      const callbackName = "talkCardsSheet" + (++requestId);
      const script = document.createElement("script");

      let finished = false;

      function cleanup() {
        script.remove();
        delete window[callbackName];
      }

      const timeout = setTimeout(() => {
        if (finished) return;
        finished = true;
        cleanup();
        showStatus("시트 연결 확인 필요 · 기본 질문 사용 중", false);
      }, 9000);

      window[callbackName] = response => {
        if (finished) return;

        finished = true;
        clearTimeout(timeout);

        const loaded = (response.table?.rows || [])
          .map(row => [
            String(row.c?.[0]?.v ?? "").trim(),
            String(row.c?.[1]?.v ?? "").trim()
          ])
          .filter(row =>
            categories.some(group => group.name === row[0]) &&
            row[1]
          );

        if (loaded.length) {
          const previousQuestion =
            getQuestions()[cardIndex]?.[1];

          rows = loaded;

          const updatedQuestions = getQuestions();

          const previousIndex =
            updatedQuestions.findIndex(
              row => row[1] === previousQuestion
            );

          cardIndex = previousIndex >= 0
            ? previousIndex
            : Math.min(
                cardIndex,
                Math.max(0, updatedQuestions.length - 1)
              );

          render();

          showStatus(
            "구글 시트 연결됨 · 질문 " + loaded.length + "개",
            true
          );
        } else {
          showStatus(
            "질문을 불러오지 못했습니다 · 기본 질문 사용 중",
            false
          );
        }

        cleanup();
      };

      script.onerror = () => {
        if (finished) return;

        finished = true;
        clearTimeout(timeout);
        cleanup();

        showStatus(
          "시트 연결 확인 필요 · 기본 질문 사용 중",
          false
        );
      };

      const query = encodeURIComponent("select A,B");
      const handler = encodeURIComponent(
        "out:json;responseHandler:" + callbackName
      );

      script.src =
        "https://docs.google.com/spreadsheets/d/" +
        SHEET_ID +
        "/gviz/tq" +
        "?gid=" + SHEET_GID +
        "&headers=1" +
        "&tq=" + query +
        "&tqx=" + handler +
        "&_=" + Date.now();

      document.head.appendChild(script);
    }

    $("refresh").addEventListener("click", loadQuestions);

    /* 질문은 60초마다 갱신 */
    setInterval(loadQuestions, 60000);

    /* 1분 단위 타이머 */
    let minutes = 20;
    let remaining = minutes * 60;
    let running = false;
    let deadline = 0;

    function updateClock() {
      const seconds = Math.ceil(remaining);

      $("clock").textContent =
        String(Math.floor(seconds / 60)).padStart(2, "0") +
        ":" +
        String(seconds % 60).padStart(2, "0");

      $("play").textContent = running ? "Ⅱ" : "▶";

      $("play").setAttribute(
        "aria-label",
        running ? "일시정지" : "타이머 시작"
      );

      $("minus").disabled = minutes <= 1;
      $("plus").disabled = minutes >= 999;
    }

    function adjustTime(amount) {
      minutes = Math.max(
        1,
        Math.min(999, minutes + amount)
      );

      remaining = minutes * 60;
      running = false;
      deadline = 0;

      updateClock();
    }

    $("minus").addEventListener("click", () => {
      adjustTime(-1);
    });

    $("plus").addEventListener("click", () => {
      adjustTime(1);
    });

    $("play").addEventListener("click", () => {
      if (running) {
        remaining = Math.max(
          0,
          (deadline - Date.now()) / 1000
        );

        running = false;
        deadline = 0;
      } else {
        if (remaining <= 0) {
          remaining = minutes * 60;
        }

        deadline = Date.now() + remaining * 1000;
        running = true;
      }

      updateClock();
    });

    $("reset").addEventListener("click", () => {
      running = false;
      deadline = 0;
      remaining = minutes * 60;

      updateClock();
    });

    function showToast(message) {
      const oldToast = document.querySelector(".toast");
      if (oldToast) oldToast.remove();

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;

      document.body.appendChild(toast);

      setTimeout(() => toast.remove(), 4000);
    }

    setInterval(() => {
      if (!running) return;

      remaining = Math.max(
        0,
        (deadline - Date.now()) / 1000
      );

      if (remaining <= 0) {
        running = false;
        deadline = 0;
        showToast("대화 시간이 끝났어요!");
      }

      updateClock();
    }, 250);

    /* 초기 실행 */
    render();
    updateClock();
    loadQuestions();
  </script>
</body>
</html>
