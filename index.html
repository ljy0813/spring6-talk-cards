
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAFAF5">
  <title>Talk Cards | SPARTA NBC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #263128;
      --bg: #fafaf5;
      --lime: #d8f58b;
      --border: #303a32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 35px 18px 60px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Gaegu", cursive;
      letter-spacing: -0.45px;
    }

    button {
      font-family: "Gaegu", cursive;
      letter-spacing: -0.55px;
      cursor: pointer;
      transition: transform .15s;
    }

    button:active {
      transform: scale(.96);
    }

    button:focus-visible {
      outline: 3px solid #a7cb70;
      outline-offset: 3px;
    }

    .app {
      max-width: 760px;
      margin: auto;
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #748271;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      background: var(--lime);
      border: 1.5px solid var(--ink);
      border-radius: 50%;
    }

    h1 {
      margin: 8px 0 2px;
      font-family: "Fredoka", sans-serif;
      font-size: clamp(39px, 7vw, 50px);
      font-weight: 600;
      letter-spacing: -2px;
      line-height: 1.3;
    }

    .title-dot {
      color: #a4c36b;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #849081;
      font-size: 19px;
      line-height: 1.3;
      letter-spacing: -2px;
    }

    /* TIMER */

    .timer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: white;
      border: 1px solid #e0e6db;
      border-radius: 17px;
      flex-shrink: 0;
    }

    .timer-symbol {
      color: #59715e;
      font-size: 21px;
    }

    .clock {
      min-width: 73px;
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .timer-btn {
      width: 30px;
      height: 32px;
      padding: 0;
      background: #f6f8f3;
      border: 1px solid #e0e6dc;
      border-radius: 9px;
      color: var(--ink);
      font-size: 21px;
      font-weight: 700;
    }

    .timer-btn:disabled {
      opacity: .35;
      cursor: default;
    }

    #play {
      background: var(--lime);
      font-size: 18px;
    }

    #reset {
      background: transparent;
      border: none;
      font-size: 26px;
    }

    /* CATEGORY */

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 40px;
    }

    .category-btn {
      padding: 10px 16px;
      background: #e9eee7;
      border: none;
      border-radius: 100px;
      color: #667566;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.5;
    }

    .category-btn.active {
      background: #293a2d;
      color: white;
    }

    /* CARD STACK */

    .deck {
      position: relative;
      isolation: isolate;
      margin: 0 12px 46px;
      touch-action: pan-y;
    }

    .back-card {
      position: absolute;
      inset: 0;
      border: 2px solid var(--border);
      border-radius: 27px;
      pointer-events: none;
      transition: background-color .25s;
    }

    .back-one {
      z-index: -2;
      transform: translate(8px, 12px) rotate(2deg);
      background: #e0cafa;
    }

    .back-two {
      z-index: -1;
      transform: translate(-8px, 8px) rotate(-2deg);
      background: #c9f0e0;
    }

    .card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 340px;
      padding: 29px;
      background: #f1fbe3;
      border: 2px solid var(--border);
      border-radius: 27px;
      transform-origin: center bottom;
      transition:
        background-color .25s,
        transform .2s,
        opacity .2s;
    }

    .card.switching-left {
      transform: translateX(-40px) rotate(-5deg);
      opacity: 0;
    }

    .card.switching-right {
      transform: translateX(40px) rotate(5deg);
      opacity: 0;
    }

    .card.entering {
      animation: cardPop .3s
        cubic-bezier(.2, 1.2, .35, 1);
    }

    @keyframes cardPop {
      from {
        transform: scale(.96) rotate(2deg);
        opacity: .5;
      }

      to {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .card-label {
      color: #5b7157;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .counter {
      padding: 5px 12px;
      background: #ffffffc9;
      border: 1px solid #00000010;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    /*
      CARD QUESTION FONT
      Gaegu 손글씨 유지
      글씨 굵기 강화
      자간 -1.2px
    */

    .question {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 35px 6px;

      font-family: "Gaegu", cursive;
      font-size: clamp(30px, 5vw, 41px);
      font-weight: 700;
      line-height: 1.28;
      letter-spacing: -1.5px;
      text-align: center;

      -webkit-text-stroke: .35px currentColor;
      paint-order: stroke fill;

      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .card-footer {
      color: #68805f;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    /* CARD BUTTONS */

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13px;
    }

    .circle-btn {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      background: white;
      border: 1px solid #dce3d8;
      border-radius: 50%;
      color: var(--ink);
      font-size: 28px;
    }

    .next-btn {
      flex: 1;
      max-width: 350px;
      min-height: 50px;
      background: var(--lime);
      border: 1px solid #bada7b;
      border-radius: 100px;
      color: var(--ink);
      font-size: 23px;
      font-weight: 700;
    }

    /* TIMER COMPLETION TOAST */

    .toast {
      position: fixed;
      z-index: 99;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 30px);
      padding: 13px 22px;
      background: #293a2d;
      border-radius: 15px;
      color: white;
      font-size: 21px;
      text-align: center;
      box-shadow: 0 8px 25px #0002;
    }

    /* MOBILE */

    @media (max-width: 620px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 19px;
      }

      .categories {
        margin-bottom: 35px;
      }
    }

    @media (max-width: 450px) {
      body {
        padding: 25px 15px 40px;
      }

      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 17px;
      }

      .category-btn {
        padding: 9px 13px;
        font-size: 17px;
      }

      .deck {
        margin: 0 8px 43px;
      }

      .card {
        min-height: 320px;
        padding: 21px;
      }

      .question {
        font-size: 33px;
        line-height: 1.27;
      }

      .card-label {
        font-size: 15px;
      }

      .card-footer {
        font-size: 22px;
      }

      .next-btn {
        font-size: 21px;
      }

      .circle-btn {
        width: 45px;
        height: 45px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .back-card,
      button {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <div class="heading">
        <div class="brand">
          <span class="brand-dot"></span>
          SPARTA NBC
        </div>

        <h1>
          Talk Cards<span class="title-dot">.</span>
        </h1>

        <p class="subtitle">
          한 장씩 넘기면서, 조금 더 가까워지는 시간.
        </p>
      </div>

      <div class="timer" aria-label="대화 타이머">

        <span class="timer-symbol">◷</span>

        <span class="clock" id="clock" role="timer">
          20:00
        </span>

        <button
          type="button"
          class="timer-btn"
          id="minus"
          aria-label="1분 줄이기"
        >−</button>

        <button
          type="button"
          class="timer-btn"
          id="plus"
          aria-label="1분 늘리기"
        >+</button>

        <button
          type="button"
          class="timer-btn"
          id="play"
          aria-label="타이머 시작"
        >▶</button>

        <button
          type="button"
          class="timer-btn"
          id="reset"
          aria-label="타이머 초기화"
        >↺</button>

      </div>

    </header>

    <nav
      class="categories"
      id="categories"
      aria-label="질문 카테고리"
    ></nav>

    <div class="deck" id="deck">

      <div
        class="back-card back-one"
        id="backOne"
      ></div>

      <div
        class="back-card back-two"
        id="backTwo"
      ></div>

      <section class="card" id="card">

        <div class="card-top">

          <span class="card-label" id="cardLabel">
            GET TO KNOW YOU
          </span>

          <span class="counter" id="counter">
            01 / 04
          </span>

        </div>

        <div class="question" id="question">
          질문을 불러오는 중입니다.
        </div>

        <div class="card-footer">
          ✳ Let's talk!
        </div>

      </section>
    </div>

    <div class="controls">

      <button
        type="button"
        class="circle-btn"
        id="prev"
        aria-label="이전 카드"
      >←</button>

      <button
        type="button"
        class="next-btn"
        id="next"
      >다음 카드 →</button>

      <button
        type="button"
        class="circle-btn"
        id="random"
        aria-label="랜덤 카드"
      >⤨</button>

    </div>

  </main>

  <script>
    "use strict";

    /* =====================================
       BASIC SETTINGS
    ===================================== */

    const SHEET_ID =
      "1xDcP7lelWfm1TWt5vAourx9lzQVt2mcNLpMI_y8AAIY";

    const SHEET_GID = "0";

    const $ = id => document.getElementById(id);

    const categories = [
      {
        name: "우리, 먼저 알아가기",
        label: "자기소개 · 일상",
        english: "GET TO KNOW YOU"
      },
      {
        name: "함께하는 팀 프로젝트",
        label: "팀 프로젝트",
        english: "TEAM PROJECT"
      },
      {
        name: "진로와 취업, 우리의 고민",
        label: "진로 · 취업",
        english: "CAREER TALK"
      }
    ];

    /* 구글 시트 연결 실패 시 사용 */

    const fallback = [
      [
        "우리, 먼저 알아가기",
        "자기소개를 해주세요! 이름, 이전에 하던 일, 부트캠프에 들어온 이유까지! (나이 제외)"
      ],
      [
        "우리, 먼저 알아가기",
        "지금 서로의 첫인상은 어떤가요?"
      ],
      [
        "우리, 먼저 알아가기",
        "살면서 겪었던 가장 웃긴 흑역사를 들려주세요!"
      ],
      [
        "우리, 먼저 알아가기",
        "나와 빠르게 친해지는 방법은 무엇인가요?"
      ],
      [
        "함께하는 팀 프로젝트",
        "지금까지 겪었던 레전드 팀플 빌런 썰을 풀어주세요!"
      ],
      [
        "함께하는 팀 프로젝트",
        "반대로, 살면서 만난 최고의 팀원은 어떤 사람이었나요?"
      ],
      [
        "함께하는 팀 프로젝트",
        "일은 잘하지만 독단적인 팀장 VS 모두의 의견을 듣지만 결정이 느린 팀장"
      ],
      [
        "진로와 취업, 우리의 고민",
        "개발자가 아니었다면 어떤 일을 하고 있었을 것 같나요?"
      ],
      [
        "진로와 취업, 우리의 고민",
        "취업 준비에서 가장 걱정되는 점은 무엇인가요?"
      ],
      [
        "진로와 취업, 우리의 고민",
        "첫 월급을 받으면 가장 먼저 무엇을 하고 싶나요?"
      ]
    ];

    const palette = [
      "#f1fbe3",
      "#ebd9fd",
      "#fff0bb",
      "#d9f5ed",
      "#ffdfd6"
    ];

    /* =====================================
       CARD STATE
    ===================================== */

    let rows = fallback;
    let categoryIndex = 0;
    let cardIndex = 0;
    let colorIndex = 0;
    let animating = false;

    function getQuestions() {
      const categoryName = categories[categoryIndex].name;

      return rows.filter(
        row => row[0] === categoryName
      );
    }

    function renderCard() {
      const group = categories[categoryIndex];
      const questions = getQuestions();

      if (questions.length > 0) {
        cardIndex =
          ((cardIndex % questions.length) +
            questions.length) % questions.length;
      } else {
        cardIndex = 0;
      }

      $("cardLabel").textContent = group.english;

      $("counter").textContent =
        String(questions.length ? cardIndex + 1 : 0)
          .padStart(2, "0") +
        " / " +
        String(questions.length).padStart(2, "0");

      $("question").textContent = questions.length
        ? questions[cardIndex][1]
        : "이 카테고리에 등록된 질문이 없습니다.";

      $("card").style.backgroundColor =
        palette[colorIndex % palette.length];

      $("backOne").style.backgroundColor =
        palette[(colorIndex + 1) % palette.length];

      $("backTwo").style.backgroundColor =
        palette[(colorIndex + 2) % palette.length];

      document
        .querySelectorAll(".category-btn")
        .forEach((button, i) => {
          const active = i === categoryIndex;

          button.classList.toggle("active", active);

          button.setAttribute(
            "aria-pressed",
            String(active)
          );
        });
    }

    /* =====================================
       CARD CATEGORIES
    ===================================== */

    categories.forEach((category, i) => {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "category-btn";
      button.textContent = category.label;

      button.addEventListener("click", () => {
        if (i === categoryIndex || animating) return;

        changeCard(() => {
          categoryIndex = i;
          cardIndex = 0;
        });
      });

      $("categories").appendChild(button);
    });

    /* =====================================
       CARD ANIMATION
    ===================================== */

    function changeCard(callback, direction = "left") {
      if (animating) return;

      animating = true;

      const card = $("card");

      card.classList.remove("entering");

      card.classList.add(
        direction === "left"
          ? "switching-left"
          : "switching-right"
      );

      setTimeout(() => {
        callback();

        colorIndex++;
        renderCard();

        card.classList.remove(
          "switching-left",
          "switching-right"
        );

        card.classList.add("entering");

        setTimeout(() => {
          card.classList.remove("entering");
          animating = false;
        }, 320);

      }, 200);
    }

    function moveCard(amount) {
      const count = getQuestions().length;

      if (count === 0 || animating) return;

      changeCard(() => {
        cardIndex =
          (cardIndex + amount + count) % count;

      }, amount > 0 ? "left" : "right");
    }

    $("prev").addEventListener("click", () => {
      moveCard(-1);
    });

    $("next").addEventListener("click", () => {
      moveCard(1);
    });

    $("random").addEventListener("click", () => {
      const count = getQuestions().length;

      if (count < 2 || animating) return;

      const offset =
        1 + Math.floor(Math.random() * (count - 1));

      moveCard(offset);
    });

    /* =====================================
       MOBILE SWIPE
    ===================================== */

    let touchStartX = 0;

    $("deck").addEventListener(
      "touchstart",
      event => {
        touchStartX =
          event.changedTouches[0].screenX;
      },
      { passive: true }
    );

    $("deck").addEventListener(
      "touchend",
      event => {
        const difference =
          event.changedTouches[0].screenX -
          touchStartX;

        if (Math.abs(difference) > 55) {
          moveCard(difference < 0 ? 1 : -1);
        }
      },
      { passive: true }
    );

    /* =====================================
       GOOGLE SHEETS
       화면에 연결 상태를 표시하지 않음
    ===================================== */

    let requestId = 0;

    function loadQuestions() {
      const callbackName =
        "talkCardsSheet" + (++requestId);

      const script = document.createElement("script");

      let finished = false;

      function cleanup() {
        script.remove();

        try {
          delete window[callbackName];
        } catch (error) {
          window[callbackName] = undefined;
        }
      }

      const timeout = setTimeout(() => {
        if (finished) return;

        finished = true;
        cleanup();

        console.warn(
          "구글 시트 연결에 실패했습니다. 현재 질문을 유지합니다."
        );
      }, 9000);

      window[callbackName] = response => {
        if (finished) return;

        finished = true;
        clearTimeout(timeout);

        try {
          const loaded = (response.table?.rows || [])
            .map(row => [
              String(row.c?.[0]?.v ?? "").trim(),
              String(row.c?.[1]?.v ?? "").trim()
            ])
            .filter(row =>
              categories.some(
                category => category.name === row[0]
              ) && row[1]
            );

          if (loaded.length > 0) {
            const oldQuestion =
              getQuestions()[cardIndex]?.[1];

            rows = loaded;

            const updated = getQuestions();

            const found = updated.findIndex(
              row => row[1] === oldQuestion
            );

            cardIndex = found >= 0
              ? found
              : Math.min(
                  cardIndex,
                  Math.max(0, updated.length - 1)
                );

            renderCard();
          }
        } catch (error) {
          console.error(
            "질문 데이터를 처리하지 못했습니다.",
            error
          );
        } finally {
          cleanup();
        }
      };

      script.onerror = () => {
        if (finished) return;

        finished = true;
        clearTimeout(timeout);
        cleanup();

        console.warn(
          "구글 시트 요청에 실패했습니다."
        );
      };

      const query = encodeURIComponent("select A,B");

      const handler = encodeURIComponent(
        "out:json;responseHandler:" + callbackName
      );

      script.src =
        "https://docs.google.com/spreadsheets/d/" +
        SHEET_ID +
        "/gviz/tq" +
        "?gid=" + SHEET_GID +
        "&headers=1" +
        "&tq=" + query +
        "&tqx=" + handler +
        "&_=" + Date.now();

      document.head.appendChild(script);
    }

    /* =====================================
       TIMER
       카드 및 시트 코드와 독립적으로 동작
    ===================================== */

    const clockElement = $("clock");
    const minusButton = $("minus");
    const plusButton = $("plus");
    const playButton = $("play");
    const resetButton = $("reset");

    let minutes = 20;
    let remaining = 20 * 60;
    let running = false;
    let deadline = 0;

    function updateClock() {
      const seconds = Math.max(
        0,
        Math.ceil(remaining)
      );

      const displayMinutes = Math.floor(seconds / 60);
      const displaySeconds = seconds % 60;

      clockElement.textContent =
        String(displayMinutes).padStart(2, "0") +
        ":" +
        String(displaySeconds).padStart(2, "0");

      playButton.textContent =
        running ? "Ⅱ" : "▶";

      playButton.setAttribute(
        "aria-label",
        running ? "타이머 일시정지" : "타이머 시작"
      );

      minusButton.disabled = minutes <= 1;
      plusButton.disabled = minutes >= 999;
    }

    function adjustTime(amount) {
      const nextMinutes = Math.max(
        1,
        Math.min(999, minutes + amount)
      );

      minutes = nextMinutes;
      remaining = minutes * 60;
      running = false;
      deadline = 0;

      updateClock();
    }

    function showToast(message) {
      document.querySelector(".toast")?.remove();

      const toast = document.createElement("div");

      toast.className = "toast";
      toast.textContent = message;

      document.body.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 4000);
    }

    function tick() {
      if (!running) return;

      remaining = Math.max(
        0,
        (deadline - Date.now()) / 1000
      );

      if (remaining <= 0) {
        remaining = 0;
        running = false;
        deadline = 0;

        showToast("대화 시간이 끝났어요!");
      }

      updateClock();
    }

    minusButton.addEventListener("click", () => {
      adjustTime(-1);
    });

    plusButton.addEventListener("click", () => {
      adjustTime(1);
    });

    playButton.addEventListener("click", () => {
      if (running) {
        tick();

        running = false;
        deadline = 0;
      } else {
        if (remaining <= 0) {
          remaining = minutes * 60;
        }

        deadline =
          Date.now() + remaining * 1000;

        running = true;
      }

      updateClock();
    });

    resetButton.addEventListener("click", () => {
      running = false;
      deadline = 0;
      remaining = minutes * 60;

      updateClock();
    });

    setInterval(tick, 250);

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          tick();
        }
      }
    );

    /* =====================================
       INITIALIZATION
    ===================================== */

    updateClock();
    renderCard();

    /* 시트 오류가 발생해도 타이머는 정상 작동 */
    loadQuestions();

    /* 질문은 60초마다 새로 불러옴 */
    setInterval(loadQuestions, 60000);

  </script>
</body>
</html>
